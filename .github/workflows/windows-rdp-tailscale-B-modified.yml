name: xbx-bot (B)

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Runtime in minutes (max 355)"
        required: false
        default: "355"
      loops:
        description: "Handoffs (0 = infinite)"
        required: false
        default: "0"
      threads:
        description: "Default thread count"
        required: false
        default: "50"

concurrency:
  group: xbx-bot-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: Bullettemporary
  RDP_PASS: Bullet@12345
  TS_HOSTNAME: bullet
  GDRIVE_ID: "1PhySp-9Ep7XV9JgxkAoOEO8VJRfq4iLv"

jobs:
  bot:
    runs-on: windows-2022
    timeout-minutes: 370

    steps:
      - name: resolve config
        id: cfg
        env:
          RAW_RUNTIME: ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS:   ${{ inputs.loops || '0' }}
          RAW_THREADS: ${{ inputs.threads || '50' }}
        run: |
          function ToIntOr($v, $def){ if("$v" -match '^\d+$'){[int]$v}else{[int]$def} }
          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($runtime -gt 360) { $runtime = 355 }
          if ($runtime -lt 6) { $runtime = 355 }
          $loops = ToIntOr $env:RAW_LOOPS 0
          $threads = ToIntOr $env:RAW_THREADS 50
          "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops" | Out-File -Append $env:GITHUB_OUTPUT
          "threads=$threads" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "runtime=$runtime loops=$loops threads=$threads"

      - name: install tailscale
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
              -OutFile "$env:TEMP\ts.exe" -UseBasicParsing
            Start-Process "$env:TEMP\ts.exe" -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          & $exe version

      - name: purge old devices
        run: |
          $hdr = @{ Authorization = "Bearer ${{ secrets.TS_API_KEY }}" }
          $tn = [uri]::EscapeDataString("${{ secrets.TS_TAILNET }}")
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr `
              -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if ($d.hostname -match '(?i)bullet' -or $d.name -match '(?i)bullet') {
                Invoke-RestMethod -Method DELETE -Headers $hdr `
                  -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" | Out-Null
                Write-Host "purged: $($d.hostname)"
              }
            }
          } catch { Write-Warning "purge failed: $_" }

      - name: tailscale up
        id: up
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout | Out-Null
          & $ts up --authkey "${{ secrets.TS_AUTHKEY }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
          Start-Sleep 2
          $ip4 = (& $ts ip -4 | Select-Object -First 1)
          $status = & $ts status --json | ConvertFrom-Json
          $fqdn = $status.Self.DNSName
          "ip4=$ip4" | Out-File -Append $env:GITHUB_OUTPUT
          "fqdn=$fqdn" | Out-File -Append $env:GITHUB_OUTPUT
          "### RDP (B)`nHost: $ip4`nDNS: $fqdn`nUser: $env:RDP_USER`nPass: $env:RDP_PASS" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: enable rdp
        run: |
          $u = $env:RDP_USER
          $p = $env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember Administrators -Member $u
            Add-LocalGroupMember "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: download bot
        run: |
          pip install gdown
          $outDir = "$env:USERPROFILE\Downloads"
          $zipFile = "$outDir\loopo.zip"
          gdown $env:GDRIVE_ID -O $zipFile
          Write-Host "downloaded to $zipFile"

      - name: extract
        run: |
          $zipFile = "$env:USERPROFILE\Downloads\loopo.zip"
          $outDir = "$env:USERPROFILE\Downloads"
          7z x $zipFile -o"$outDir" -y
          Write-Host "--- zip contents ---"
          Get-ChildItem "$outDir" -Recurse -Name | Select-Object -First 20

      - name: install deps
        run: |
          cd "$env:USERPROFILE\Downloads\loopo"
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          DEFAULT_THREADS: ${{ steps.cfg.outputs.threads }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          cd "$env:USERPROFILE\Downloads\loopo"
          python bot.py

      - name: keep alive
        if: failure()
        run: |
          $mins = [int]"${{ steps.cfg.outputs.runtime }}"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            $left = [int][math]::Ceiling(($end - (Get-Date)).TotalMinutes)
            Write-Host "alive... $left min"
            Start-Sleep 60
          }

      - name: purge device
        if: always()
        run: |
          $hdr = @{ Authorization = "Bearer ${{ secrets.TS_API_KEY }}" }
          $tn = [uri]::EscapeDataString("${{ secrets.TS_TAILNET }}")
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr `
              -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if ($d.hostname -match '(?i)bullet') {
                Invoke-RestMethod -Method DELETE -Headers $hdr `
                  -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" | Out-Null
                Write-Host "exit purge: $($d.hostname)"
              }
            }
          } catch {}

      - name: dispatch A
        if: always()
        run: |
          $loops = [int]"${{ steps.cfg.outputs.loops }}"
          if ($loops -eq 1) { Write-Host "done"; exit 0 }
          if ($loops -gt 1) { $next = $loops - 1 } else { $next = 0 }

          $body = @{
            ref = "${{ github.ref_name }}"
            inputs = @{
              runtime_minutes = "${{ steps.cfg.outputs.runtime }}"
              loops = "$next"
              threads = "${{ steps.cfg.outputs.threads }}"
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-rdp-tailscale-A.yml/dispatches" `
            -Headers @{
              Authorization = "Bearer ${{ secrets.GH_PAT }}"
              "Accept" = "application/vnd.github+json"
            } -Body $body
